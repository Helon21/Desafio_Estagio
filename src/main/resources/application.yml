spring:
  application:
    name: DesafioAPI
  datasource:
    url: jdbc:postgresql://postgres-db:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    jpa:
      show-sql: true
    flyway:
      baseline-description: true
      baseline-on-migrate: true
      create-schemas: true
      default-schema: public
      enabled: true
      locations: classpath:db/migration
      schemas: public
      validate-on-migrate: true

springdoc:
  swagger-ui:
    path: /docs-desafio-api.html
  api-docs:
    path: /docs-desafio-api
  packages-to-scan: com.teste.estagio.api.controller